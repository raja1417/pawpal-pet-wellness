name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment
        type: choice
        options: [staging, production]
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    env:
      NAMESPACE: pawpal
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: azure/login@v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/aks-set-context@v4.0.3
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.16.4
      - name: Deploy atomically
        run: |
          trap 'helm rollback pawpal -n "$NAMESPACE" 0 || true' ERR
          helm dependency build charts/pawpal
          helm upgrade --install pawpal charts/pawpal \
            --namespace "$NAMESPACE" --create-namespace \
            --values charts/pawpal/values-prod.yaml \
            --set api.image.tag="${GITHUB_REF_NAME}" \
            --set web.image.tag="${GITHUB_REF_NAME}" \
            --atomic --wait --timeout 10m
      - name: Smoke test
        run: |
          URL="https://${{ vars.PAWPAL_HOST }}/api/health"
          for attempt in {1..12}; do
            curl --fail --silent --show-error "$URL" && exit 0
            sleep 10
          done
          helm rollback pawpal -n "$NAMESPACE" 0 || true
          exit 1
