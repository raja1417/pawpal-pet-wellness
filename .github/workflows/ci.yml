name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [server, web]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pawpal
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: pawpal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pawpal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    env:
      NODE_ENV: test
      DATABASE_URL: unused-in-unit-tests
      JWT_SECRET: ci-test-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - if: matrix.package == 'server'
        run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
