name: Deploy infrastructure

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/**"
  workflow_dispatch:
    inputs:
      environment:
        description: Infrastructure environment
        required: true
        type: choice
        options: [dev, production]
        default: dev
      action:
        description: Terraform operation
        required: true
        type: choice
        options: [apply, destroy]
        default: apply

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    if: ${{ github.event_name == 'push' || inputs.action == 'apply' }}
    uses: raja1417/github-actions-workflows/.github/workflows/terraform-plan.yml@46f7f73286ef3fbd947e8f317c2b88262cf3c6af
    with:
      working-directory: infrastructure
      init-args: >-
        -input=false
        -backend-config=bucket=${{ vars.TF_BACKEND_BUCKET }}
        -backend-config=key=pawpal/${{ inputs.environment == 'production' && 'prod' || 'dev' }}/terraform.tfstate
        -backend-config=region=${{ vars.AWS_REGION }}
      artifact-name: pawpal-${{ inputs.environment == 'production' && 'prod' || 'dev' }}-plan
    secrets: inherit

  apply:
    needs: plan
    if: ${{ github.event_name == 'push' || inputs.action == 'apply' }}
    uses: raja1417/github-actions-workflows/.github/workflows/terraform-apply.yml@46f7f73286ef3fbd947e8f317c2b88262cf3c6af
    with:
      working-directory: infrastructure
      init-args: >-
        -input=false
        -backend-config=bucket=${{ vars.TF_BACKEND_BUCKET }}
        -backend-config=key=pawpal/${{ inputs.environment == 'production' && 'prod' || 'dev' }}/terraform.tfstate
        -backend-config=region=${{ vars.AWS_REGION }}
      environment: ${{ inputs.environment == 'production' && 'production' || 'dev' }}
      artifact-name: pawpal-${{ inputs.environment == 'production' && 'prod' || 'dev' }}-plan
      auto-approve: true
    secrets: inherit

  destroy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'destroy' }}
    uses: raja1417/github-actions-workflows/.github/workflows/terraform-destroy.yml@46f7f73286ef3fbd947e8f317c2b88262cf3c6af
    with:
      working-directory: infrastructure
      init-args: >-
        -input=false
        -backend-config=bucket=${{ vars.TF_BACKEND_BUCKET }}
        -backend-config=key=pawpal/${{ inputs.environment == 'production' && 'prod' || 'dev' }}/terraform.tfstate
        -backend-config=region=${{ vars.AWS_REGION }}
      environment: ${{ inputs.environment == 'production' && 'production' || 'dev' }}
      confirm_destroy: true
    secrets: inherit
