name: Helm

on:
  pull_request:
    paths: ["charts/**", ".github/workflows/helm-lint.yml"]
  push:
    branches: [main]
    paths: ["charts/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.16.4
      - run: helm dependency build charts/pawpal
      - run: helm lint charts/pawpal
      - run: helm template pawpal charts/pawpal --namespace pawpal > rendered.yaml
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform
      - run: kubeconform -strict -summary rendered.yaml
