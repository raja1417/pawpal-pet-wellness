name: Build and publish container images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  tags:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.tags.outputs.api }}
      web: ${{ steps.tags.outputs.web }}
    steps:
      - id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
        run: |
          branch=$(printf '%s' "$REF_NAME" | tr '/[:upper:]' '-[:lower:]')
          for component in api web; do
            image="ghcr.io/raja1417/pawpal-$component"
            {
              echo "$component<<EOF"
              echo "$image:latest"
              echo "$image:$branch"
              echo "$image:$SHA"
              if [ "$REF_TYPE" = "tag" ]; then
                echo "$image:${REF_NAME#v}"
              fi
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          done

  api:
    needs: tags
    uses: raja1417/github-actions-workflows/.github/workflows/docker-build-push.yml@v1
    with:
      image: ghcr.io/raja1417/pawpal-api
      context: server
      file: server/Dockerfile
      tags: ${{ needs.tags.outputs.api }}
      platforms: linux/amd64,linux/arm64
      push: true
      scan: true
    secrets:
      registry-username: ${{ github.actor }}
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  web:
    needs: tags
    uses: raja1417/github-actions-workflows/.github/workflows/docker-build-push.yml@v1
    with:
      image: ghcr.io/raja1417/pawpal-web
      context: web
      file: web/Dockerfile
      tags: ${{ needs.tags.outputs.web }}
      platforms: linux/amd64,linux/arm64
      push: true
      scan: true
    secrets:
      registry-username: ${{ github.actor }}
      registry-password: ${{ secrets.GITHUB_TOKEN }}
