nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []
namespace: ""

api:
  replicaCount: 2
  image:
    repository: ghcr.io/raja1417/pawpal-api
    tag: latest
    digest: ""
    pullPolicy: IfNotPresent
  service:
    port: 3000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75

web:
  replicaCount: 2
  image:
    repository: ghcr.io/raja1417/pawpal-web
    tag: latest
    digest: ""
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: 8080
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75

config:
  nodeEnv: production
  corsOrigin: ""
  logLevel: info

secrets:
  create: false
  existingSecret: pawpal-secrets
  databaseUrlKey: database-url
  jwtSecretKey: jwt-secret
  databaseUrl: ""
  jwtSecret: ""

ingress:
  enabled: true
  className: nginx
  annotations: {}
  host: ""
  tls:
    enabled: true
    secretName: pawpal-tls

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podDisruptionBudget:
  enabled: true
  minAvailable: 1

postgresql:
  enabled: false
  auth:
    username: pawpal
    database: pawpal
    existingSecret: pawpal-postgresql
