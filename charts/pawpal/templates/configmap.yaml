apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pawpal.fullname" . }}
  labels:
    {{- include "pawpal.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  PORT: {{ .Values.api.service.port | quote }}
  CORS_ORIGIN: {{ default (printf "https://%s" .Values.ingress.host) .Values.config.corsOrigin | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
