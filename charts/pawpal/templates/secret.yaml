{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pawpal.fullname" . }}
  labels:
    {{- include "pawpal.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.databaseUrlKey }}: {{ required "secrets.databaseUrl is required when creating a secret" .Values.secrets.databaseUrl | quote }}
  {{ .Values.secrets.jwtSecretKey }}: {{ required "secrets.jwtSecret is required when creating a secret" .Values.secrets.jwtSecret | quote }}
{{- end }}
